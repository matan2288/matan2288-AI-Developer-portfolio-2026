    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;

      .loader {

      .spinner {

        border-radius: 50%;
        animation: spin 0.8s linear infinite;

      @keyframes spin {

      }
    </style>
