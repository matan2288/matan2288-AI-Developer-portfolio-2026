[build]
  command = "if [ -n \"$TINA_CLIENT_ID\" ]; then npx tinacms build; fi && npm run build"
  publish = "dist"
  ignore = "bash -c 'if [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . \":(exclude)content\"'"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


