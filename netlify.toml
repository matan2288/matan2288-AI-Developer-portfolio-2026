[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/editor-auth"
  to = "/.netlify/functions/editor-auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/recommendations"
  to = "/.netlify/functions/recommendations"
  status = 200
  force = true

[[redirects]]
  from = "/api/content-commit"
  to = "/.netlify/functions/content-commit"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200




